title: User
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              type: text
              display: Name
          -
            handle: email
            field:
              type: text
              input_type: email
              display: 'Email Address'
          -
            handle: avatar
            field:
              type: assets
              container: assets
              max_files: 1
              display: Avatar
          -
            handle: bio
            field:
              type: textarea
              display: Bio
              instructions: 'Shown under posts when "Show post author" is on.'
          -
            handle: website
            field:
              type: text
              input_type: url
              display: Website
          -
            handle: roles
            field:
              type: user_roles
              width: 50
          -
            handle: groups
            field:
              type: user_groups
              width: 50
